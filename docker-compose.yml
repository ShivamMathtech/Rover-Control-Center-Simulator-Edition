services:
  rover:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODE: simulation
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env with at least 12 characters}
      DATABASE_URL: postgresql+psycopg://rover:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rover
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rover
      POSTGRES_DB: rover
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - rover_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rover -d rover"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  rover_database:
